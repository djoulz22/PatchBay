<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Association Patchbay</title>
  <link rel="stylesheet" href="options.css">
  <script type="module" src="options.js"></script>
</head>
<body>
  <main>
    <h1>Associer à Patchbay</h1>
    <p>Dans Patchbay, ouvre <strong>Ajouter une source → Onglets du navigateur</strong> et copie le code d'association.</p>
    <form id="pairing-form">
      <label for="pairing">Code d'association</label>
      <input type="password" id="pairing" required autocomplete="off" spellcheck="false" maxlength="100">
      <label for="browser">Nom du navigateur dans Patchbay</label>
      <select id="browser">
        <option value="">Détection automatique</option>
        <option value="Brave">Brave</option>
        <option value="Chrome">Chrome</option>
        <option value="Edge">Edge</option>
        <option value="Chromium">Chromium</option>
      </select>
      <div class="actions">
        <button type="submit" id="associate">Associer</button>
        <button type="button" class="secondary" id="forget" hidden>Dissocier</button>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p>Ensuite, clique sur l'icône de Patchbay dans chaque onglet à récupérer. Le son de l'onglet passe par Patchbay pendant la capture. Clique de nouveau sur l'icône pour arrêter.</p>
  </main>
</body>
</html>
